<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MAFIA TEAM | Reclutamiento abierto en Minecraft</title>
  <meta name="description" content="Únete a MAFIA TEAM, la familia de Minecraft Java. Rangos, áreas de guerra, finanzas y sicarios. Postúlate con tu Discord y elige tu rol.">
  <link rel="canonical" href="https://mafia.agenciaartemoda.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:url" content="https://mafia.agenciaartemoda.com/">
  <meta property="og:title" content="MAFIA TEAM | Reclutamiento abierto">
  <meta property="og:description" content="La familia de Minecraft Java busca gente. Elige tu rol, sube de rango y únete a la mafia.">
  <meta property="og:image" content="https://mafia.agenciaartemoda.com/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3">
  <link rel="stylesheet" href="css/layout.css?v=3">
  <link rel="stylesheet" href="css/views.css?v=3">
</head>
<body>
  <header class="top">
    <a class="brand px" href="./"><img src="assets/favicon.png" alt="" width="28" height="28">MAFIA TEAM</a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  </header>

  <main>
    <section class="view hero" id="inicio" role="tabpanel">
      <h1><img class="logo" src="assets/logo.png" alt="MAFIA TEAM" width="815" height="780"></h1>
      <span class="badge px"><i></i>Reclutamiento abierto · Solo Java</span>
      <p class="lead">Una familia, un servidor, una sola palabra. Elige tu rol y gánate tu rango.</p>
      <div class="cta" id="hiring"></div>
      <div class="cta">
        <button class="btn" type="button" data-go="unirme">Quiero entrar</button>
        <button class="btn alt" type="button" data-go="rangos">Ver rangos</button>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="view" id="rangos" role="tabpanel" hidden>
      <h2 class="title">Los rangos</h2>
      <div class="md" id="ranks"></div>
    </section>

    <section class="view" id="areas" role="tabpanel" hidden>
      <h2 class="title">Las áreas</h2>
      <div class="md" id="areas-md"></div>
    </section>

    <section class="view" id="miembros" role="tabpanel" hidden>
      <h2 class="title">Los miembros</h2>
      <div class="md" id="members-md"></div>
    </section>

    <section class="view" id="codigo" role="tabpanel" hidden>
      <h2 class="title">El código</h2>
      <ol class="rules" id="rules"></ol>
    </section>

    <section class="view" id="unirme" role="tabpanel" hidden>
      <h2 class="title">Unirme a la familia</h2>
      <form class="panel form" id="form" novalidate>
        <label>Nick de Minecraft<input name="nick" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" placeholder="Steve_123" autocomplete="off"></label>
        <label>Usuario de Discord<input name="discord" required maxlength="33" placeholder="tuusuario" autocomplete="off"></label>
        <label>Rol que quieres<select name="rol" id="rol" required></select></label>
        <input class="hp" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit">Enviar</button>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </form>
      <p class="note">Solo Java. Un Reclutador te escribe por Discord.</p>
    </section>
  </main>

  <script src="js/data.js?v=3" defer></script>
  <script src="js/pixel.js?v=3" defer></script>
  <script src="js/render.js?v=3" defer></script>
  <script src="js/form.js?v=3" defer></script>
</body>
</html>
